<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>抖音本地版</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button type="button" id="btn-menu" class="icon-btn" aria-label="设置" title="设置">
        <span class="burger" aria-hidden="true"></span>
      </button>
    </header>

    <main id="feed" class="feed" aria-label="视频流"></main>

    <div id="empty" class="empty hidden">
      <p class="empty-title">还没有视频</p>
      <p class="empty-desc">在设置里选择包含视频的文件夹</p>
      <button type="button" id="btn-empty-settings" class="btn primary">打开设置</button>
    </div>

    <div id="hint" class="hint">上滑下一个 · 下滑上一个</div>

    <div id="hud" class="hud" aria-hidden="true">
      <div class="hud-row">
        <span id="play-pos" class="play-pos" aria-live="polite">0/0</span>
        <span id="time-cur" class="hud-time">00:00:00</span>
        <div id="hud-bar" class="hud-bar" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="hud-track">
            <i id="time-fill" class="hud-fill"></i>
            <span id="hud-thumb" class="hud-thumb"></span>
          </div>
        </div>
        <span id="time-total" class="hud-time">00:00:00</span>
        <button type="button" id="btn-mode" class="hud-mode" title="切换播放模式">列表循环</button>
      </div>
    </div>

    <div id="settings-mask" class="settings-mask hidden" aria-hidden="true"></div>
    <aside id="settings" class="settings" aria-hidden="true">
      <div class="settings-head">
        <h2>设置</h2>
        <button type="button" id="btn-close-settings" class="icon-btn ghost" aria-label="关闭">✕</button>
      </div>
      <div class="settings-body">
        <div class="field">
          <div class="field-label">视频目录</div>
          <div id="folder-label" class="field-value">未选择</div>
          <div id="count-label" class="field-hint">0 个视频</div>
          <button type="button" id="btn-folder" class="btn primary block">选择目录</button>
        </div>
      </div>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
